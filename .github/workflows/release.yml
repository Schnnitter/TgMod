
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite
      - main

permissions:
  contents: read

concurrency:
  group: tgmod-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TgMod Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            gcc \
            g++ \
            make \
            curl \
            ninja-build \
            ccache

      - name: Configure API keys
        run: |
          cat > API_KEYS <<'EOF'
          APP_ID=6
          APP_HASH="eb06d4abfb49dc3eeb1aeb98ae0f581e"
          MAPS_V2_API=0
          SIGNING_KEY_STORE_PASSWORD=TgModBuildOnly2026!
          SIGNING_KEY_ALIAS=tgmod
          SIGNING_KEY_PASSWORD=TgModBuildOnly2026!
          EOF

      - name: Create signing keystore
        run: |
          mkdir -p config

          keytool -genkeypair \
            -keystore config/extera.jks \
            -storepass 'TgModBuildOnly2026!' \
            -keypass 'TgModBuildOnly2026!' \
            -alias tgmod \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TgMod, OU=Android, O=TgMod, C=US" \
            -noprompt

      - name: Configure Google Services
        run: |
          mkdir -p TMessagesProj

          cat > TMessagesProj/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "tgmod-build"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.radolyn.ayugram"
                  }
                },
                "api_key": [
                  {
                    "current_key": "dummy-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build Beta Debug APK
        run: |
          ./gradlew \
            --no-configuration-cache \
            --no-daemon \
            :TMessagesProj:assembleBetaDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TgMod-Debug-APK
          path: TMessagesProj/build/outputs/apk/beta/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
